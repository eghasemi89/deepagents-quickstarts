name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: deep-research-agent
  DOCKER_IMAGE: deep-research-agent

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          cd deep_research

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Generate LangGraph config from langgraph.json
        id: langgraph-config
        run: |
          cd deep_research
          # Generate LANGGRAPH_AUTH and LANGGRAPH_HTTP from langgraph.json
          # The script outputs export statements, so we eval them to set the variables
          eval $(python3 deployment/generate_langgraph_env.py)
          # Set GitHub Actions outputs (multiline values need special handling)
          {
            echo "LANGGRAPH_AUTH<<EOF"
            echo "${LANGGRAPH_AUTH}"
            echo "EOF"
            echo "LANGGRAPH_HTTP<<EOF"
            echo "${LANGGRAPH_HTTP}"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          echo "✅ Generated LANGGRAPH_AUTH: ${LANGGRAPH_AUTH}"
          echo "✅ Generated LANGGRAPH_HTTP: ${LANGGRAPH_HTTP}"

      - name: Create environment file for deployment
        run: |
          cat > .env.deploy << EOF
          POSTGRES_URI=${{ secrets.POSTGRES_URI }}
          DATABASE_URI=${{ secrets.POSTGRES_URI }}
          REDIS_URI=${{ secrets.REDIS_URI }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          LANGGRAPH_CLOUD_LICENSE_KEY=${{ secrets.LANGGRAPH_CLOUD_LICENSE_KEY }}
          LANGGRAPH_AUTH=${{ steps.langgraph-config.outputs.LANGGRAPH_AUTH }}
          LANGGRAPH_HTTP=${{ steps.langgraph-config.outputs.LANGGRAPH_HTTP }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          EOF

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -e

          # Setup SSH (robust: handles \n, CRLF, and accidental quotes)
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import os, pathlib
          key = os.environ["EC2_SSH_KEY"]
          key = key.replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          key = key.strip()
          if (key.startswith('"') and key.endswith('"')) or (key.startswith("'") and key.endswith("'")):
            key = key[1:-1]
          path = pathlib.Path.home() / ".ssh" / "deploy_key"
          path.write_text(key + ("\n" if not key.endswith("\n") else ""))
          print("Wrote SSH key to", path)
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          # Fail fast if key is invalid
          ssh-keygen -lf ~/.ssh/deploy_key

          # Copy files to EC2
          scp -i ~/.ssh/deploy_key deep_research/deployment/docker-compose.aws.yml \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/docker-compose.aws.yml"

          scp -i ~/.ssh/deploy_key .env.deploy \
            "$EC2_USER@$EC2_HOST:/home/$EC2_USER/.env"

          # Deploy on EC2
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << EOF
            set -e

            aws ecr get-login-password --region ${AWS_REGION} | \
              docker login --username AWS --password-stdin ${ECR_REGISTRY}

            APP_IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

            # Ensure APP_IMAGE is available to docker-compose (compose reads .env)
            # Replace existing APP_IMAGE line if present; otherwise append.
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s|^APP_IMAGE=.*|APP_IMAGE=\$APP_IMAGE|" .env
            else
              echo "APP_IMAGE=\$APP_IMAGE" >> .env
            fi

            echo "=== Rendered compose images (redis/langgraph-api) ==="
            docker-compose -f docker-compose.aws.yml --env-file .env config | \
              awk '/services:/{flag=1} flag{print} /volumes:/{exit}' | \
              grep -E 'redis:|langgraph-api:|image:' || true
            echo "====================================================="

            docker-compose -f docker-compose.aws.yml --env-file .env down || true
            docker pull \$APP_IMAGE
            docker-compose -f docker-compose.aws.yml --env-file .env up -d

            docker image prune -f
          EOF

      - name: Verify deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -e

          # Setup SSH (same robust key write)
          mkdir -p ~/.ssh
          python3 - <<'PY'
          import os, pathlib
          key = os.environ["EC2_SSH_KEY"]
          key = key.replace("\\n", "\n")
          key = key.replace("\r\n", "\n").replace("\r", "\n")
          key = key.strip()
          if (key.startswith('"') and key.endswith('"')) or (key.startswith("'") and key.endswith("'")):
            key = key[1:-1]
          path = pathlib.Path.home() / ".ssh" / "deploy_key"
          path.write_text(key + ("\n" if not key.endswith("\n") else ""))
          print("Wrote SSH key to", path)
          PY
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/deploy_key

          sleep 30

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "docker-compose -f docker-compose.aws.yml --env-file .env ps"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "docker-compose -f docker-compose.aws.yml --env-file .env exec -T langgraph-api python -c 'import httpx; httpx.get(\"http://localhost:8000/docs\", timeout=5)'" \
            || echo "Health check failed, but deployment completed"
