# Docker Compose file for AWS production deployment
# This version uses external ElastiCache Redis (no local Redis container)
# Use this when you have ElastiCache set up in AWS

# version: '3.8'  # Version is obsolete in newer docker-compose

services:
  langgraph-api:
    # Image will be set by CI/CD workflow
    # For local testing, uncomment build section:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    image: deep-research-api:latest
    ports:
      - "8123:8000"
    stdin_open: true
    tty: true
    environment:
      # Database - required
      - POSTGRES_URI=${POSTGRES_URI}
      # Redis - required (uses ElastiCache endpoint from environment)
      - REDIS_URI=${REDIS_URI}
      # API Keys - required
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      # Optional API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Optional: Enterprise license (alternative to LANGSMITH_API_KEY)
      - LANGGRAPH_CLOUD_LICENSE_KEY=${LANGGRAPH_CLOUD_LICENSE_KEY:-}
      # Authentication - required if using auth.py
      # Uses absolute path in container (/api/security/auth.py:auth)
      # Can be overridden in .env file with LANGGRAPH_AUTH
      - LANGGRAPH_AUTH=${LANGGRAPH_AUTH}
      # HTTP App - required if using custom webapp
      # Uses absolute path in container (/api/webapp_advanced.py:app)
      # Can be overridden in .env file with LANGGRAPH_HTTP
      - LANGGRAPH_HTTP=${LANGGRAPH_HTTP}
      # Optional: Authentication credentials (if using auth.py)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/docs', timeout=5)"]
      # Note: Health check uses container port 8000, not host port 8123
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Keep container running - don't exit on command completion
    command: []

